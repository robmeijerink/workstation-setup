---
# =========================================================
# FEDORA / LINUX (firewalld)
# =========================================================
- name: Fedora | Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == "RedHat"

- name: Fedora | Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  become: true
  when: ansible_os_family == "RedHat"

- name: Fedora | Set default zone to drop incoming by default
  ansible.builtin.command: firewall-cmd --set-default-zone=FedoraWorkstation
  register: firewalld_zone
  changed_when: "'ZONE_ALREADY_SET' not in firewalld_zone.stderr and firewalld_zone.rc == 0"
  failed_when: firewalld_zone.rc != 0 and 'ZONE_ALREADY_SET' not in firewalld_zone.stderr
  become: true
  when: ansible_os_family == "RedHat"

- name: Fedora | Allow SSH service
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled
  become: true
  when: ansible_os_family == "RedHat"

- name: Fedora | Allow standard web traffic
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
  become: true
  when: ansible_os_family == "RedHat"

# =========================================================
# MACOS (ALF)
# =========================================================
- name: macOS | Enable Application Firewall
  ansible.builtin.command:
    cmd: "/usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on"
  become: true
  changed_when: false
  when: ansible_os_family == "Darwin"

- name: macOS | Enable Stealth Mode
  ansible.builtin.command:
    cmd: "/usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on"
  become: true
  changed_when: false
  when: ansible_os_family == "Darwin"
