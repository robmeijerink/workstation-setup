---
# =========================================================
# Fedora Sway Base Playbook
# ========================================================
# ---------------------------------------------------------
# 1. Install Base System Requirements via DNF
# ---------------------------------------------------------
- name: Install core system requirements for Fedora
  ansible.builtin.dnf:
    name:
      - "@development-tools"
      - openssh-server
      - procps-ng
      - file
      - git
      - ca-certificates
      - zsh
      - htop
      - wl-clipboard
      - gnupg2
      - pinentry
      - gnome-keyring
      - libsecret
      - dnf-plugins-core
      - unzip
      - zip
      - p7zip
      - p7zip-plugins
    state: present
    update_cache: yes
  become: true
  tags: [install, base, fedora]

# ---------------------------------------------------------
# 2. Bootstrap Homebrew on Linux
# ---------------------------------------------------------
- name: Check if Homebrew is already installed
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: linuxbrew_check
  tags: [install, base, brew]

- name: Install Homebrew (Linuxbrew) silently
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  when: not linuxbrew_check.stat.exists
  tags: [install, base, brew]

# ---------------------------------------------------------
# 3. PERFORMANCE: Inotify Watchers (Crucial for Node/Vite)
# ---------------------------------------------------------
- name: Increase inotify max_user_watches for development
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "524288"
    state: present
    reload: yes
  become: true
  tags: [config, performance, fedora]

# ---------------------------------------------------------
# 4. Ensure sshd is enabled and running
# ---------------------------------------------------------
- name: Enable and start sshd
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
  become: true
  tags: [config, security, ssh]

# ---------------------------------------------------------
# 5. SECURITY: SSH Hardening
# ---------------------------------------------------------
- name: Disable SSH Password Authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart SSH
  tags: [config, security, ssh]

- name: Disable SSH Root Login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart SSH
  tags: [config, security, ssh]

# ---------------------------------------------------------
# 6. SECURITY: Automatic Security Updates (dnf-automatic)
# ---------------------------------------------------------
- name: Install dnf-automatic package
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  become: true
  tags: [config, security, updates]

- name: Configure dnf-automatic (Security Only, No Auto-Reboot)
  ansible.builtin.copy:
    dest: /etc/dnf/automatic.conf
    content: |
      [commands]
      upgrade_type = security
      random_sleep = 0
      network_online_timeout = 60
      download_updates = yes
      apply_updates = yes
      reboot = never

      [emitters]
      emit_via = stdio

      [base]
      debuglevel = 1
    mode: "0644"
    owner: root
    group: root
  become: true
  tags: [config, security, updates]

- name: Enable and start dnf-automatic timer
  ansible.builtin.service:
    name: dnf-automatic.timer
    state: started
    enabled: true
  become: true
  tags: [config, security, updates]
