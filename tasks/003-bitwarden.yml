---
# =========================================================
# Bitwarden Deployment & Authentication Workflow
# =========================================================

# ---------------------------------------------------------
# 1. macOS Installation (Desktop & CLI)
# ---------------------------------------------------------
- name: Install Bitwarden Desktop (macOS)
  community.general.homebrew_cask:
    name: bitwarden
    state: present
  when: ansible_os_family == 'Darwin'
  tags: [bitwarden, install, macos]

- name: Install Bitwarden CLI (macOS)
  community.general.homebrew:
    name: bitwarden-cli
    state: present
  when: ansible_os_family == 'Darwin'
  tags: [bitwarden, install, macos]

# ---------------------------------------------------------
# 2. Fedora Installation (Desktop RPM & Native CLI)
# ---------------------------------------------------------
- name: Install Bitwarden Desktop via RPM (Fedora)
  block:
    - name: Download Bitwarden Desktop RPM package
      ansible.builtin.get_url:
        url: "https://vault.bitwarden.com/download/?app=desktop&platform=linux&variant=rpm"
        dest: "/tmp/bitwarden.rpm"
        mode: "0644"

    - name: Install Bitwarden Desktop
      ansible.builtin.dnf:
        name: "/tmp/bitwarden.rpm"
        state: present
        disable_gpg_check: yes
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [bitwarden, install, fedora]

- name: Install Bitwarden CLI Native Binary (Fedora)
  ansible.builtin.unarchive:
    src: "https://vault.bitwarden.com/download/?app=cli&platform=linux&variant=zip"
    dest: "/usr/local/bin"
    remote_src: yes
    mode: "0755"
    creates: "/usr/local/bin/bw"
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [bitwarden, install, fedora]

# ---------------------------------------------------------
# 3. Security: Session Validation
# ---------------------------------------------------------
- name: Verify Bitwarden authentication status
  ansible.builtin.command: bw status
  register: bw_status
  changed_when: false
  failed_when: false
  tags: [always, security]

- name: Warn if Bitwarden vault is not unlocked
  ansible.builtin.debug:
    msg: "Bitwarden vault is not unlocked. The dotfiles step (150) clones over SSH via the Bitwarden agent and will fail while the vault is locked."
  when: "'unlocked' not in (bw_status.stdout | default(''))"
  tags: [always, security]
