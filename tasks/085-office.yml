---
# =========================================================
# Optional: Opt-in Office Suite (macOS & Fedora)
# Usage: ansible-playbook office.yml --tags office
# =========================================================

# ---------------------------------------------------------
# Fedora (Sway/Wayland) Execution
# ---------------------------------------------------------
- name: Install FreeOffice via RPM package (Fedora)
  ansible.builtin.dnf:
    name: "https://www.softmaker.net/down/softmaker-freeoffice-2024_x86_64.rpm"
    state: present
    disable_gpg_check: yes
  become: true
  when: ansible_os_family == 'RedHat'
  tags:
    - never
    - office

# ---------------------------------------------------------
# macOS (Apple macOS) Execution
# ---------------------------------------------------------
- name: Install FreeOffice via Homebrew Cask (macOS)
  community.general.homebrew_cask:
    name: freeoffice
    state: present
    accept_external_apps: true
  when: ansible_os_family == 'Darwin'
  tags:
    - never
    - office