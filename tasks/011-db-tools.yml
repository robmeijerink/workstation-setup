---
# =========================================================
# Database Client Infrastructure
# =========================================================

- name: Install Database Utilities on Fedora
  block:
    - name: Install Native CLI Clients
      ansible.builtin.dnf:
        name:
          - postgresql
          - mariadb
          - sqlite
        state: present
        update_cache: yes
      become: true

    - name: Add TablePlus GPG Key
      ansible.builtin.rpm_key:
        key: https://yum.tableplus.com/apt.tableplus.com.gpg.key
        state: present
      become: true

    - name: Add TablePlus Repository
      ansible.builtin.yum_repository:
        name: tableplus
        description: TablePlus
        baseurl: https://yum.tableplus.com/rpm/x86_64
        enabled: yes
        gpgcheck: yes
        gpgkey: https://yum.tableplus.com/apt.tableplus.com.gpg.key
      become: true

    - name: Install TablePlus (Linux Native)
      ansible.builtin.dnf:
        name: tableplus
        state: present
      become: true
  when: ansible_os_family == 'RedHat'

- name: Install Database Utilities on macOS
  block:
    - name: Install native CLI clients (Keg-only)
      community.general.homebrew:
        name:
          - libpq
          - mysql-client
          - sqlite
        state: present

    - name: Install TablePlus (macOS GUI)
      community.general.homebrew_cask:
        name: tableplus
        state: present
  when: ansible_os_family == 'Darwin'