---
# =========================================================
# Cross-Platform CLI Utilities
# =========================================================
- name: Install shared cross-platform CLI tools via Homebrew
  community.general.homebrew:
    name:
      - stow
      - tmux
      - fzf
      - ripgrep
      - fd
      - sd
      - jq
      - yq
      - zoxide
      - bat
      - eza
      - lazygit
      - lazydocker
      - git-delta
      - gum
      - chafa
      - php-code-sniffer
      - tree-sitter
      - stylua
      - prettierd
      - lnav
      - k9s
      - go-task
    state: present
    update_homebrew: yes
    path: "{{ '/home/linuxbrew/.linuxbrew/bin' if ansible_os_family == 'RedHat' else omit }}"
  tags: [install, cli, tools]

- name: Install macOS specific Homebrew packages
  community.general.homebrew:
    name:
      - coreutils
    state: present
  when: ansible_os_family == 'Darwin'
  tags: [install, cli, tools, macos]

- name: Install sad from its dedicated tap (macOS)
  block:
    - name: Tap the sad Homebrew repository
      community.general.homebrew_tap:
        name: ms-jpq/sad
        state: present

    - name: Trust the sad tap for non-interactive installs
      ansible.builtin.command:
        cmd: "{{ '/opt/homebrew/bin/brew' if ansible_architecture == 'arm64' else '/usr/local/bin/brew' }} trust --tap ms-jpq/sad"
      changed_when: false
      failed_when: false

    - name: Install sad (Space Age seD)
      community.general.homebrew:
        name: ms-jpq/sad/sad
        state: present
  when: ansible_os_family == 'Darwin'
  tags: [install, cli, tools, macos]

- name: Install Linux specific Homebrew packages
  community.general.homebrew:
    name:
      - sad
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  when: ansible_os_family == 'RedHat'
  tags: [install, cli, tools, fedora]

