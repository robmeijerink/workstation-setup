---
# =========================================================
# Multi-OS Browser Deployment
# =========================================================

# ---------------------------------------------------------
# Fedora (Wayland) Logic
# ---------------------------------------------------------
- name: Install Browsers on Fedora
  block:
    - name: Ensure Firefox is installed (Native DNF)
      ansible.builtin.dnf:
        name: firefox
        state: present
      become: true

    - name: Add Brave Browser GPG Key
      ansible.builtin.rpm_key:
        key: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        state: present
      become: true

    - name: Add Brave Browser Repository
      ansible.builtin.yum_repository:
        name: brave-browser
        description: Brave Browser
        baseurl: https://brave-browser-rpm-release.s3.brave.com/x86_64/
        enabled: yes
        gpgcheck: yes
        gpgkey: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      become: true

    - name: Install Brave Browser (Chromium Engine)
      ansible.builtin.dnf:
        name: brave-browser
        update_cache: yes
        state: present
      become: true
  when: ansible_os_family == 'RedHat'

# ---------------------------------------------------------
# macOS Logic
# ---------------------------------------------------------
- name: Install Browsers on macOS via Homebrew Cask
  community.general.homebrew_cask:
    name:
      - firefox
      - brave-browser
    state: present
  when: ansible_os_family == 'Darwin'