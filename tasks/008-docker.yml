---
# ---------------------------------------------------------
# 1. Install Docker & Colima (macOS)
# ---------------------------------------------------------
- name: Install Docker CLI and Colima via Homebrew
  community.general.homebrew:
    name:
      - docker
      - docker-compose
      - colima
    state: present
  when: ansible_os_family == 'Darwin'
  tags: [install, docker, macos]

# ---------------------------------------------------------
# 2. Install Native Docker Engine (Fedora)
# ---------------------------------------------------------
- block:
    - name: Add Docker official DNF repository
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
        enabled: yes
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/fedora/gpg

    - name: Install Docker Engine and Compose V2
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [install, docker, fedora]

# ---------------------------------------------------------
# 3. Post-Install: Enable service & User Permissions (Fedora)
# ---------------------------------------------------------
- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [config, docker, service]

- name: Ensure user is added to the docker group
  ansible.builtin.user:
    name: "{{ lookup('env', 'USER') }}"
    groups: docker
    append: yes
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [config, docker, security]

- name: Apply docker group membership without logout for current session
  ansible.builtin.meta: reset_connection
  tags: [install, docker]
