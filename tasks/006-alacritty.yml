---
# ---------------------------------------------------------
# 1. Install Alacritty (macOS)
# ---------------------------------------------------------
- name: Install Alacritty via Homebrew Cask
  community.general.homebrew_cask:
    name: alacritty
    state: present
  when: ansible_os_family == 'Darwin'
  tags: [alacritty, install, macos]

# ---------------------------------------------------------
# 2. Install Alacritty (Fedora)
# ---------------------------------------------------------
- name: Install Alacritty via DNF
  ansible.builtin.dnf:
    name: alacritty
    state: present
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [alacritty, install, fedora]
