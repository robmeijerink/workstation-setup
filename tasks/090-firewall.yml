---
# =========================================================
# UBUNTU / LINUX (UFW)
# =========================================================
- name: Ubuntu | Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == "Debian"

- name: Ubuntu | Reset UFW to factory defaults
  community.general.ufw:
    state: reset
  become: true
  when: ansible_os_family == "Debian"

- name: Ubuntu | Set default incoming policy to DENY
  community.general.ufw:
    direction: incoming
    policy: deny
  become: true
  when: ansible_os_family == "Debian"

- name: Ubuntu | Set default outgoing policy to ALLOW
  community.general.ufw:
    direction: outgoing
    policy: allow
  become: true
  when: ansible_os_family == "Debian"

- name: Ubuntu | Allow SSH with rate limiting
  community.general.ufw:
    rule: limit
    port: ssh
    proto: tcp
  become: true
  when: ansible_os_family == "Debian"

- name: Ubuntu | Allow standard web traffic
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80
    - 443
  become: true
  when: ansible_os_family == "Debian"

- name: Ubuntu | Enable UFW logging
  community.general.ufw:
    logging: "on"
  become: true
  when: ansible_os_family == "Debian"

- name: Ubuntu | Enable UFW and commit changes
  community.general.ufw:
    state: enabled
  become: true
  when: ansible_os_family == "Debian"

# =========================================================
# MACOS (ALF)
# =========================================================
- name: macOS | Enable Application Firewall
  ansible.builtin.command:
    cmd: "/usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on"
  become: true
  changed_when: false
  when: ansible_os_family == "Darwin"

- name: macOS | Enable Stealth Mode
  ansible.builtin.command:
    cmd: "/usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on"
  become: true
  changed_when: false
  when: ansible_os_family == "Darwin"
