---
# ---------------------------------------------------------
# 1. Install Neovim (macOS)
# ---------------------------------------------------------
- name: Install Neovim via Homebrew
  community.general.homebrew:
    name: neovim
    state: present
  when: ansible_os_family == 'Darwin'
  tags: [install, neovim, macos]

# ---------------------------------------------------------
# 2. Install Neovim (Fedora)
# ---------------------------------------------------------
- name: Install Neovim via DNF
  ansible.builtin.dnf:
    name: neovim
    state: present
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [install, neovim, fedora]

# ---------------------------------------------------------
# 3. Mason System Dependencies (The "Toolbox")
# ---------------------------------------------------------
- name: Ensure Mason can extract and install binaries
  ansible.builtin.dnf:
    name:
      - unzip
      - wget
      - gzip
      - tar
      - "@development-tools" # Required for compiling some tree-sitter parsers or Go tools
    state: present
  become: true
  when: ansible_os_family == 'RedHat'
  tags: [install, neovim, mason]